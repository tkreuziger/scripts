[project]
name = "scripts"
version = "0.0.0"
description = "A personal collection of small, standalone command-line tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tristan Kreuziger" }]
dependencies = []

[dependency-groups]
dev = ["ruff>=0.9"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["scripts/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]